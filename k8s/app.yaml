apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifestylestore
  labels: { app: lifestylestore }
spec:
  replicas: 2
  selector:
    matchLabels: { app: lifestylestore }
  template:
    metadata:
      labels: { app: lifestylestore }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/shubham541/lifestylestore:2.0.0
          ports:
            - containerPort: 8080
          env:
            - name: OPENAPI_ENABLED
              value: "false"
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: lifestylestore-secrets, key: MONGODB_URI } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: lifestylestore-secrets, key: JWT_SECRET } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: lifestylestore-secrets, key: ANTHROPIC_API_KEY, optional: true } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lifestylestore
spec:
  selector: { app: lifestylestore }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lifestylestore
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: lifestylestore }
